<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike Service Tracker</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --ink:#16202b; --muted:#66727f; --line:#dde3e9;
    --accent:#0b5cad; --accent2:#e8f1fb; --danger:#b3261e; --dangerbg:#fdecea;
    --warn:#8a5a00; --warnbg:#fff3d6; --okbg:#e6f4ea; --radius:12px; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--ink); color:#fff; padding:16px; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 32px; }
  header .wrap { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding-bottom:0; }
  h1 { margin:0; font-size:26px; }
  .tagline { margin:4px 0 0; color:#c9d4df; font-size:14px; }
  .tabs { display:flex; gap:8px; margin:16px 0; flex-wrap:wrap; }
  .tab-btn { border:1px solid var(--line); background:#fff; padding:10px 16px; border-radius:999px; cursor:pointer; font-size:15px; }
  .tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .lang-btn { background:#fff; color:var(--ink); border:0; border-radius:999px; padding:8px 14px; cursor:pointer; font-weight:600; white-space:nowrap; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; }
  .stat .num { font-size:24px; font-weight:700; }
  .stat .lbl { color:var(--muted); font-size:13px; margin-top:2px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
  .card-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .section-title { font-size:18px; margin:20px 0 10px; }
  .muted { color:var(--muted); }
  .small { font-size:13px; }
  .hidden { display:none !important; }
  form { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
  .field input, .field select { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:15px; background:#fff; }
  .full { grid-column: 1 / -1; }
  .err { color:var(--danger); font-size:13px; margin-top:8px; min-height:18px; }
  .btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; cursor:pointer; font-size:15px; }
  .btn.secondary { background:#e9edf1; color:var(--ink); }
  .btn.danger { background:var(--danger); }
  .btn.small { padding:6px 12px; font-size:13px; }
  .btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .due-row, .row-line { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); }
  .due-row:last-child, .row-line:last-child { border-bottom:0; }
  .badge { font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .badge.overdue { background:var(--dangerbg); color:var(--danger); }
  .badge.due-soon { background:var(--warnbg); color:var(--warn); }
  .meta-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:12px; }
  .right { text-align:right; flex-shrink:0; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; max-width:92vw; text-align:center; }
  .toast.show { opacity:1; }
  .toast.err { background:var(--danger); }
  footer { color:var(--muted); font-size:13px; text-align:center; padding:16px; }
  @media (max-width: 600px) {
    .stats { grid-template-columns:repeat(2,1fr); }
    .meta-grid { grid-template-columns:repeat(2,1fr); }
    .grid { grid-template-columns:1fr; }
    h1 { font-size:22px; }
    .row-line { flex-direction:column; }
    .right { text-align:left; }
  }
</style>
</head>
<body>
<header><div class="wrap">
  <div><h1 id="appTitle">Bike Service Tracker</h1><p class="tagline" id="tagline"></p></div>
  <button class="lang-btn" id="langBtn">Bangla</button>
</div></header>

<main class="wrap">
  <nav class="tabs">
    <button class="tab-btn active" id="tab-dashboard" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" id="tab-bikes" data-tab="bikes">Bikes</button>
    <button class="tab-btn" id="tab-services" data-tab="services">Services</button>
    <button class="tab-btn" id="tab-data" data-tab="data">Data</button>
  </nav>

  <section id="panel-dashboard">
    <div class="stats">
      <div class="stat"><div class="num" id="statSpent">-</div><div class="lbl" id="lblSpent"></div></div>
      <div class="stat"><div class="num" id="statServices">-</div><div class="lbl" id="lblServices"></div></div>
      <div class="stat"><div class="num" id="statBikes">-</div><div class="lbl" id="lblBikes"></div></div>
      <div class="stat"><div class="num" id="statCpk">-</div><div class="lbl" id="lblCpk"></div></div>
    </div>
    <h2 class="section-title" id="upcomingTitle"></h2>
    <div class="card" id="dueList"></div>
    <h2 class="section-title" id="recentTitle"></h2>
    <div class="card" id="recentList"></div>
  </section>

  <section id="panel-bikes" class="hidden">
    <form id="bikeForm" novalidate>
      <h2 class="section-title" id="bikeFormTitle" style="margin-top:0"></h2>
      <div class="grid">
        <div class="field"><label id="lblBikeName" for="bikeName"></label><input id="bikeName" type="text" autocomplete="off"></div>
        <div class="field"><label id="lblModel" for="bikeModel"></label><input id="bikeModel" type="text" autocomplete="off"></div>
        <div class="field"><label id="lblPlate" for="bikePlate"></label><input id="bikePlate" type="text" autocomplete="off"></div>
        <div class="field"><label id="lblPurchase" for="bikePurchase"></label><input id="bikePurchase" type="date"></div>
        <div class="field"><label id="lblOdo" for="bikeOdo"></label><input id="bikeOdo" type="number" inputmode="numeric" min="0" step="1"></div>
      </div>
      <div class="err" id="bikeErr"></div>
      <div class="btn-row"><button class="btn" id="bikeSaveBtn" type="submit"></button><button class="btn secondary hidden" id="bikeCancelBtn" type="button"></button></div>
    </form>
    <div id="bikeList"></div>
  </section>

  <section id="panel-services" class="hidden">
    <form id="svcForm" novalidate>
      <h2 class="section-title" id="serviceFormTitle" style="margin-top:0"></h2>
      <div class="grid">
        <div class="field"><label id="lblSvcBike" for="svcBike"></label><select id="svcBike"></select></div>
        <div class="field"><label id="lblSvcDate" for="svcDate"></label><input id="svcDate" type="date"></div>
        <div class="field"><label id="lblSvcOdo" for="svcOdo"></label><input id="svcOdo" type="number" inputmode="numeric" min="0" step="1"></div>
        <div class="field"><label id="lblSvcType" for="svcType"></label><select id="svcType"></select></div>
        <div class="field"><label id="lblSvcGarage" for="svcGarage"></label><input id="svcGarage" type="text" autocomplete="off"></div>
        <div class="field"><label id="lblSvcCost" for="svcCost"></label><input id="svcCost" type="text" inputmode="decimal" autocomplete="off"></div>
        <div class="field"><label id="lblSvcParts" for="svcParts"></label><input id="svcParts" type="text" autocomplete="off"></div>
        <div class="field"><label id="lblSvcNextOdo" for="svcNextOdo"></label><input id="svcNextOdo" type="number" inputmode="numeric" min="0" step="1"></div>
        <div class="field"><label id="lblSvcNextDate" for="svcNextDate"></label><input id="svcNextDate" type="date"></div>
        <div class="field full"><label id="lblSvcNote" for="svcNote"></label><input id="svcNote" type="text" autocomplete="off"></div>
      </div>
      <div class="err" id="svcErr"></div>
      <div class="btn-row"><button class="btn" id="svcSaveBtn" type="submit"></button><button class="btn secondary hidden" id="svcCancelBtn" type="button"></button></div>
    </form>
    <div class="field" style="margin-bottom:12px; max-width:320px;"><label id="lblFilter" for="svcFilter"></label><select id="svcFilter"></select></div>
    <h2 class="section-title" id="historyTitle"></h2>
    <div class="card" id="serviceHistory"></div>
  </section>

  <section id="panel-data" class="hidden">
    <div class="card">
      <div class="btn-row" style="margin-top:0">
        <button class="btn" id="exportBtn" type="button"></button>
        <label class="btn secondary" id="importLabel" for="importFile"></label>
        <input class="hidden" id="importFile" type="file" accept="application/json,.json">
        <button class="btn danger" id="clearBtn" type="button"></button>
      </div>
      <div id="clearBox" class="hidden" style="margin-top:16px;">
        <div class="field" style="max-width:320px;"><label id="lblConfirm" for="deleteInput"></label><input id="deleteInput" type="text" autocomplete="off"></div>
        <div class="btn-row"><button class="btn danger" id="clearConfirmBtn" type="button"></button></div>
      </div>
    </div>
  </section>
</main>

<footer id="footerNote"></footer>
<div class="toast" id="toast"></div>
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
